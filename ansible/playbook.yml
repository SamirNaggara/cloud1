---
- name: Automated deployment of Cloud-1 infrastructure
  hosts: all
  become: yes

  vars:
    project_dir: /opt/cloud1

  tasks:
    # --- 1. PRÉPARATION DU SERVEUR ---
    - name: Update APT cache
      apt:
        update_cache: yes
        cache_valid_time: 3600
      when: env == 'prod'

    - name: Install Docker and dependencies
      apt:
        name:
          - docker.io
          - docker-compose-v2
        state: present
      when: env == 'prod'

    - name: Ensure Docker service is started and enabled
      systemd:
        name: docker
        state: started
        enabled: yes
      when: env == 'prod'

    # --- 2. COPIE DES FICHIERS DE BASE ---
    - name: Create project directory on target server
      file:
        path: "{{ project_dir }}"
        state: directory
        mode: "0755"

    - name: Copy specific project files to server
      copy:
        src: "../{{ item }}"
        dest: "{{ project_dir }}/"
      loop:
        - docker-compose.yaml
        - nginx

    - name: Ensure certs directory exists
      file:
        path: "{{ project_dir }}/certs"
        state: directory

    # --- 3. GESTION DES CERTIFICATS (Local vs Prod) ---
    - name: Generate self-signed certificate (LOCAL ONLY)
      command: >
        openssl req -x509 -nodes -days 365 -newkey rsa:2048
        -keyout {{ project_dir }}/certs/cloud1.key
        -out {{ project_dir }}/certs/cloud1.crt
        -subj "/C=FR/ST=IDF/L=Paris/O=42/OU=Cloud1/CN={{ main_domain }}"
        -addext "subjectAltName = DNS:{{ main_domain }}, DNS:pma.{{ main_domain }}"
      args:
        creates: "{{ project_dir }}/certs/cloud1.crt"
      when: env == 'local'

    - name: Install Certbot (PROD ONLY)
      apt:
        name: certbot
        state: present
      when: env == 'prod'

    - name: Generate Let's Encrypt certificate (PROD ONLY)
      command: >
        certbot certonly --standalone --non-interactive --agree-tos
        --email contact@codeyourlife.fr
        -d {{ main_domain }} -d pma.{{ main_domain }}
      args:
        creates: "/etc/letsencrypt/live/{{ main_domain }}/fullchain.pem"
      when: env == 'prod'

    - name: Copy Let's Encrypt certs to project folder (PROD ONLY)
      copy:
        src: "/etc/letsencrypt/live/{{ main_domain }}/{{ item.src }}"
        dest: "{{ project_dir }}/certs/{{ item.dest }}"
        remote_src: yes
      loop:
        - { src: "fullchain.pem", dest: "cloud1.crt" }
        - { src: "privkey.pem", dest: "cloud1.key" }
      when: env == 'prod'

    # --- 4. GÉNÉRATION DES FICHIERS DYNAMIQUES ---
    - name: Generate .env file from template
      template:
        src: templates/env.j2
        dest: "{{ project_dir }}/.env"

    - name: Deploy Nginx config as default
      template:
        src: ../nginx/conf.d/cloud1.conf.j2
        dest: "{{ project_dir }}/nginx/conf.d/default.conf"
      # On ne crée PAS de cloud1.conf en plus, un seul fichier suffit

    # --- 5. LANCEMENT DE L'INFRASTRUCTURE ---
    - name: Start containers via Docker Compose
      command: docker compose up -d
      args:
        chdir: "{{ project_dir }}"

    - name: Install WP-CLI inside WordPress container
      command: >
        docker exec cloud1_wordpress sh -c "curl -s -o /usr/local/bin/wp https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar && chmod +x /usr/local/bin/wp"
      # On force changed_when: false pour garder un affichage propre dans Ansible
      changed_when: false
      # On attend que le conteneur soit bien démarré pour lancer la commande
      retries: 5
      delay: 5
      register: dl_result
      until: dl_result.rc == 0

    - name: Finalize WordPress installation via WP-CLI
      command: >
        docker exec cloud1_wordpress wp core install
        --url="https://{{ main_domain }}"
        --title="{{ wp_title }}"
        --admin_user="{{ wp_admin_user }}"
        --admin_password="{{ wp_admin_password }}"
        --admin_email="{{ wp_admin_email }}"
        --allow-root
      register: wp_install
      changed_when: "'WordPress is already installed' not in wp_install.stdout"
      failed_when:
        - wp_install.rc != 0
        - "'WordPress is already installed' not in wp_install.stdout"
